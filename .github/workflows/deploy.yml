name: Deploy SpeakEasy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy unified SWA
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Assemble monorepo into dist/
        run: bash scripts/build-monorepo.sh

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SPEAKEASY }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # We pre-built into dist/ above, so point the action at that directly
          # and tell it not to rebuild.
          app_location: 'dist'
          api_location: 'api'
          output_location: ''
          skip_app_build: true
          # Let the action run `npm install` in api/ so busboy (and any
          # future deps) are present on the Functions host.
