name: Deploy email coach
on:
  push:
    branches: [main]
    paths: ['e-mail-coach/**', '.github/workflows/deploy-email-coach.yml']
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EMAIL_COACH }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'e-mail-coach/prototype_v2'
          output_location: ''
          skip_app_build: true
