name: Deploy bel-angst
on:
  push:
    branches: [main]
    paths: ['bel-angst/**', '.github/workflows/deploy-bel-angst.yml']
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BEL_ANGST }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'bel-angst'
          # api_location can be added once bel-angst grows its own Functions
          # (for the /api/config + ephemeral realtime token endpoint).
          output_location: ''
          skip_app_build: true
