name: Deploy social-sim
on:
  push:
    branches: [main]
    paths: ['social-sim-claude/**', '.github/workflows/deploy-social-sim.yml']
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SOCIAL_SIM }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'social-sim-claude'
          api_location: 'social-sim-claude/api'
          output_location: 'dist'
